<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>סורק שבירת קווי מגמה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1117;--panel:#161b22;--panel2:#1c2330;--line:#2a3340;--txt:#e6edf3;--mut:#8b98a8;
--grn:#3fb950;--red:#f85149;--amb:#d29922;--blu:#58a6ff;--pur:#bc8cff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:Heebo,system-ui,sans-serif;font-size:15px}
.num{font-family:"JetBrains Mono",monospace;direction:ltr;unicode-bidi:isolate}
header{padding:22px 16px 10px;max-width:1200px;margin:auto}
h1{margin:0;font-size:24px}
.sub{color:var(--mut);margin-top:6px;font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
.kpi b{display:block;font-size:24px;margin-top:4px}
.kpi span{color:var(--mut);font-size:12px}
nav{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
nav .in{max-width:1200px;margin:auto;display:flex;gap:4px;overflow-x:auto;padding:0 16px}
nav button{background:none;border:0;color:var(--mut);padding:12px 14px;font:inherit;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent}
nav button.on{color:var(--txt);border-color:var(--blu)}
nav .ct{background:var(--panel2);border-radius:9px;padding:1px 7px;font-size:12px;margin-inline-start:5px}
main{max-width:1200px;margin:auto;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.sym{font-size:20px;font-weight:700}
.nm{color:var(--mut);font-size:12px}
.badge{font-size:12px;padding:3px 9px;border-radius:20px;white-space:nowrap}
.b-breakout{background:#3fb95026;color:var(--grn)}.b-above{background:#58a6ff26;color:var(--blu)}
.b-near{background:#d2992226;color:var(--amb)}.b-forming{background:#8b98a826;color:var(--mut)}
svg{width:100%;height:150px;display:block;margin:10px 0 6px}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 10px;font-size:12px}
.st div>span{color:var(--mut);display:block}
.st div b{font-weight:600}
.tags{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;border:1px solid var(--line);border-radius:6px;padding:2px 6px;color:var(--mut)}
.tag.ok{color:var(--grn);border-color:#3fb95055}.tag.no{color:var(--red);border-color:#f8514955}
.empty{color:var(--mut);padding:40px;text-align:center;background:var(--panel);border-radius:12px}
.pos{color:var(--grn)}.neg{color:var(--red)}
table{width:100%;border-collapse:collapse;background:var(--panel);border-radius:12px;overflow:hidden;font-size:13px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right}
th{color:var(--mut);font-weight:500}
.prose{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;line-height:1.7}
.prose h3{margin-top:0}
.conf{font-size:11px;padding:1px 6px;border-radius:5px;margin-inline-start:6px}
.c-f{background:#3fb95022;color:var(--grn)}.c-e{background:#d2992222;color:var(--amb)}
.filters{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.filters input,.filters select{background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:7px 10px;font:inherit}
a{color:var(--blu)}
@media(max-width:420px){.grid{grid-template-columns:1fr}}
</style>
<style>
.b-break_up{background:#3fb950;color:#0d1117}.b-break_down{background:#f85149;color:#0d1117}
.b-near_up{background:#3fb95026;color:var(--grn)}.b-near_down{background:#f8514926;color:var(--red)}
.ix{font-size:10px;border:1px solid var(--line);border-radius:5px;padding:1px 5px;color:var(--mut);margin-inline-start:4px}
.alert{background:var(--panel2);border:1px dashed var(--line);border-radius:8px;padding:8px 10px;margin-top:8px;font-size:13px}
.legend{display:flex;gap:12px;font-size:11px;color:var(--mut);flex-wrap:wrap}.legend i{display:inline-block;width:14px;height:2px;vertical-align:middle;margin-inline-end:4px}
.xnav{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin-top:8px}
</style>
</head>
<body>
<header>
  <h1>📏 פריצת שיאים יורדים · שבירת שפלים עולים — S&amp;P 500 · נאסד"ק 100 · דאו ג'ונס</h1>
  <div class="sub" id="sub"></div>
  <div class="xnav"><a href="../trend/">📈 חציית EMA30/50</a><a href="../cross20/">✂️ EMA20/SMA20 + RSI10</a><a href="../channel/">📐 תעלות מחיר</a><a href="../trendline/">📏 שבירת קווי מגמה</a><a href="../presweep/">🧲 Pre-Sweep לונג</a><a href="../r2k/">🔎 ראסל 2000 · שורט + ביסוס</a></div>
  <div class="kpis" id="kpis"></div>
</header>
<nav><div class="in" id="tabs"></div></nav>
<main id="main"></main>
<script>
const D = /*__DATA__*/null;
const KIND={break_up:"פריצת שיאים יורדים ▲",break_down:"שבירת שפלים עולים ▼",near_up:"קרוב לפריצה",near_down:"קרוב לשבירה"};
const TABS=[["break_up","🚀 פריצה היום"],["break_down","💥 שבירה היום"],["near_up","👀 קרוב לפריצה"],["near_down","👀 קרוב לשבירה"],["all","טבלה מלאה"],["hist","היסטוריה"],["method","מתודולוגיה"]];
let tab="break_up",q="",sec="",ix="";
const f=(x,d=2)=>x==null?"—":Number(x).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
const sg=x=>`<span class="num ${x>=0?'pos':'neg'}">${x>=0?'+':''}${f(x)}%</span>`;
function chart(r){
  const k=r.chart,n=k.c.length,W=340,H=160,pad=6,o=k.off;
  const LN=k.c.map((_,i)=>i<o?null:k.line[i-o]);
  const all=[...k.h,...k.l,...LN.filter(x=>x!=null)],lo=Math.min(...all),hi=Math.max(...all);
  const X=i=>pad+(W-2*pad)*i/(n-1),Y=v=>H-pad-(H-2*pad)*(v-lo)/(hi-lo);
  const line=(a,col,w)=>{let p="",m=true;a.forEach((v,i)=>{if(v==null){m=true;return;}p+=`${m?'M':'L'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`;m=false;});return `<path d="${p}" fill="none" stroke="${col}" stroke-width="${w}"/>`;};
  const wick=k.c.map((v,i)=>`<line x1="${X(i)}" x2="${X(i)}" y1="${Y(k.h[i])}" y2="${Y(k.l[i])}" stroke="#8b98a866" stroke-width="1"/>`).join("");
  const col=r.side==="res"?"#d29922":"#58a6ff";
  const tds=k.t.map(i=>`<circle cx="${X(i)}" cy="${Y(r.side==='res'?k.h[i]:k.l[i])}" r="2.8" fill="none" stroke="${col}" stroke-width="1.4"/>`).join("");
  const today=`<circle cx="${X(n-1)}" cy="${Y(k.c[n-1])}" r="3.6" fill="${r.kind==='break_up'||r.kind==='near_up'?'#3fb950':'#f85149'}"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="גרף ${r.sym}">${line(LN,col,1.6)}${wick}${line(k.c,"#e6edf3",1.3)}${tds}${today}</svg>
   <div class="legend"><span><i style="background:${col}"></i>${r.side==="res"?"קו שיאים יורדים":"קו שפלים עולים"}</span><span><i style="background:#e6edf3"></i>סגירה</span><span>○ נגיעות</span><span>● היום</span></div>`;
}
function card(r){
  const brk=r.kind.startsWith("break");
  return `<div class="card"><div class="top"><div><div class="sym">${r.sym}</div><div class="nm">${r.name} · ${r.sector}</div><div style="margin-top:3px">${r.idx.map(x=>`<span class="ix" style="margin:0 0 0 4px">${x}</span>`).join("")}</div></div>
   <div style="text-align:left"><span class="badge b-${r.kind}">${KIND[r.kind]}</span><div class="num" style="margin-top:6px">$${f(r.close)} ${sg(r.chg)}</div></div></div>
   <div class="alert">🔔 הקו היום: <b class="num">$${f(r.line)}</b> · ${brk?"הסגירה":"מרחק"} <b class="num">${f(Math.abs(r.dist_atr))}</b> ATR ${brk?(r.side==="res"?"מעליו":"מתחתיו"):(r.side==="res"?"מתחתיו":"מעליו")} (${sg(r.dist_pct)})
     <div class="nm" style="margin-top:4px">${brk?`ווליום היום פי ${f(r.vol_ratio)} מהממוצע${r.vol_ratio>=1.5?" · <b>פריצה בווליום</b>":""}`:"הקו עדיין שלם · כדאי להגדיר התראה ברמת הקו"}</div></div>
   ${chart(r)}
   <div class="st" style="margin-top:8px">
    <div><span>נגיעות בקו</span><b class="num">${r.touches}</b></div>
    <div><span>אורך הקו</span><b class="num">${r.life} ימים</b></div>
    <div><span>נגיעה אחרונה</span><b class="num">לפני ${r.last_touch} ימים</b></div>
    <div><span>שיפוע לחודש</span><b>${sg(r.slope_m)}</b></div>
    <div><span>ATR(14)</span><b class="num">$${f(r.atr)} · ${f(r.atr_pct)}%</b></div>
    <div><span>ווליום / ממוצע 50</span><b class="num">${f(r.vol_ratio)}x</b></div>
    <div><span>RSI(14)</span><b class="num">${f(r.rsi14,1)}</b></div>
    <div><span>RSI(35)/EMA(10)</span><b class="num">${f(r.rsi35_ema10,1)}</b></div>
    <div><span>EMA20 / EMA30</span><b class="num">${f(r.ema20)} / ${f(r.ema30)}</b></div>
    <div><span>EMA50 / EMA200</span><b class="num">${f(r.ema50)} / ${f(r.ema200)}</b></div>
    <div><span>SMA20 / SMA150</span><b class="num">${f(r.sma20)} / ${f(r.sma150)}</b></div>
   </div>
   <div class="tags"><span class="tag ${r.above50?'ok':'no'}">${r.above50?'מעל':'מתחת'} SMA50</span>
    <span class="tag ${r.above200?'ok':'no'}">${r.above200?'מעל':'מתחת'} SMA200</span>
    <a class="tag" href="https://finviz.com/quote.ashx?t=${r.sym}" target="_blank" rel="noopener">Finviz ↗</a>
    <a class="tag" href="https://www.tradingview.com/chart/?symbol=${r.sym}" target="_blank" rel="noopener">TradingView ↗</a></div></div>`;
}
function filtered(){return D.results.filter(r=>(!q||r.sym.includes(q.toUpperCase())||r.name.toUpperCase().includes(q.toUpperCase()))&&(!sec||r.sector===sec)&&(!ix||r.idx.includes(ix)));}
function filtersBar(){const secs=[...new Set(D.results.map(r=>r.sector))].sort();
  return `<div class="filters"><input id="q" placeholder="חיפוש סימול / שם" value="${q}"><select id="ix"><option value="">כל המדדים</option>${["S&P 500","Nasdaq-100","Dow 30"].map(s=>`<option ${s===ix?'selected':''}>${s}</option>`).join("")}</select><select id="sec"><option value="">כל הסקטורים</option>${secs.map(s=>`<option ${s===sec?'selected':''}>${s}</option>`).join("")}</select></div>`;}
function render(){
  const m=document.getElementById("main");
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));
  if(tab==="method"){m.innerHTML=method();return;}
  if(tab==="hist"){m.innerHTML=hist();return;}
  const rows=filtered();
  if(tab==="all"){
    m.innerHTML=filtersBar()+`<div style="overflow-x:auto"><table><tr><th>סימול</th><th>מצב</th><th>סגירה</th><th>שינוי</th><th>קו</th><th>מרחק ATR</th><th>מרחק %</th><th>נגיעות</th><th>אורך</th><th>שיפוע/חודש</th><th>ווליום</th><th>RSI14</th><th>מדדים</th><th>סקטור</th></tr>`+
    rows.map(r=>`<tr><td><b>${r.sym}</b></td><td><span class="badge b-${r.kind}">${KIND[r.kind]}</span></td><td class="num">${f(r.close)}</td><td>${sg(r.chg)}</td><td class="num">${f(r.line)}</td><td class="num">${f(r.dist_atr)}</td><td>${sg(r.dist_pct)}</td><td class="num">${r.touches}</td><td class="num">${r.life}</td><td>${sg(r.slope_m)}</td><td class="num">${f(r.vol_ratio)}x</td><td class="num">${f(r.rsi14,0)}</td><td>${r.idx.join(", ")}</td><td>${r.sector}</td></tr>`).join("")+`</table></div>`;
  } else {
    const rs=rows.filter(r=>r.kind===tab);
    m.innerHTML=filtersBar()+(rs.length?`<div class="grid">${rs.map(card).join("")}</div>`:`<div class="empty">אין היום מניות במצב הזה.</div>`);
  }
  const qi=document.getElementById("q");if(qi){qi.oninput=e=>{q=e.target.value;render();const n=document.getElementById("q");n.focus();n.setSelectionRange(q.length,q.length);};}
  const si=document.getElementById("sec");if(si){si.onchange=e=>{sec=e.target.value;render();};}
  const xi=document.getElementById("ix");if(xi){xi.onchange=e=>{ix=e.target.value;render();};}
}
function hist(){
  const cell=(a,cl)=>a?`<span class="num ${cl}">${a.length}</span> · ${a.join(", ")||"—"}`:"—";
  return `<table><tr><th>תאריך</th><th>פריצה ▲</th><th>שבירה ▼</th><th>קרוב לפריצה</th><th>קרוב לשבירה</th></tr>`+
   D.history.map(h=>`<tr><td class="num">${h.date}</td><td>${cell(h.break_up,"pos")}</td><td>${cell(h.break_down,"neg")}</td><td>${h.near_up?`<span class="num">${h.near_up.length}</span>`:"—"}</td><td>${h.near_down?`<span class="num">${h.near_down.length}</span>`:"—"}</td></tr>`).join("")+`</table>`;
}
function method(){
  const p=D.params;
  return `<div class="prose"><h3>מה הסורק בודק</h3>
  <p>בכל יום מסחר בשעה 23:10 שעון ישראל נסרקות כל המניות של S&P 500, נאסד"ק 100 ודאו ג'ונס, על נרות יומיים.</p>
  <ul><li><b>קו שיאים יורדים (התנגדות):</b> קו דרך לפחות ${p.min_touch} שיאים יורדים, באורך של ${p.min_len} עד ${p.max_len} ימי מסחר (כחודש עד חצי שנה). שיא = הגבוה ביותר בטווח של ${p.swing} נרות לכל צד, ובין שני שיאי העיגון יש לפחות ${p.min_gap} ימים. מאז השיא הראשון ועד אתמול אף סגירה לא הייתה מעל הקו, ופתיל רשאי לחרוג עד ${p.pierce} ATR.</li>
  <li><b>פריצה היום:</b> הסגירה של היום מעל הקו, בפעם הראשונה.</li>
  <li><b>קו שפלים עולים (תמיכה) ושבירה היום:</b> ההפך. קו דרך שפלים עולים, אף סגירה לא הייתה מתחתיו עד אתמול, והסגירה של היום מתחתיו.</li>
  <li><b>קרוב לפריצה / לשבירה:</b> הקו עדיין שלם, והסגירה של היום במרחק של עד ${p.near} ATR(14) ממנו. זו רשימה להגדרת התראות.</li>
  <li><b>בחירת הקו:</b> לכל מניה נבחר הקו עם הכי הרבה נגיעות, ובשוויון הארוך יותר. נגיעה = שיא (או שפל) במרחק של עד ${p.touch} ATR מהקו.</li>
  <li><b>מיון:</b> פריצות ושבירות לפי הווליום של היום ביחס לממוצע 50 הימים (פריצה בווליום גבוה נחשבת אמינה יותר). הרשימות של "קרוב" לפי המרחק מהקו.</li></ul>
  <h3>רמת ודאות ומקורות</h3>
  <p>מחירים, ATR, ממוצעים ו‑RSI <span class="conf c-f">עובדה</span>, מ‑Yahoo Finance, מתואמים לפיצולים בלבד כמו ב‑TradingView וב‑Finviz.</p>
  <p>קו המגמה עצמו הוא פרשנות אלגוריתמית <span class="conf c-e">הסקה</span>. מי שמשרטט ידנית עשוי לבחור נקודות עיגון אחרות. כדאי לאשר בגרף לפני כניסה.</p>
  <p class="sub">מקור הרשימות: ${D.source} · נסרקו ${D.scanned} מתוך ${D.universe}${D.stale?` · ${D.stale} ללא נר של היום`:""} · קווי התנגדות תקפים: ${D.lines.res} · קווי תמיכה תקפים: ${D.lines.sup} · נוצר ${D.generated}</p></div>`;
}
(function init(){
  const c=k=>D.results.filter(r=>r.kind===k).length;
  document.getElementById("sub").innerHTML=(D.intraday?`<div style="background:#d2992226;color:#d29922;padding:8px 12px;border-radius:8px;margin-bottom:6px">⚠️ הרצת בדיקה במהלך יום המסחר. הנתונים חלקיים ויוחלפו בסריקה של 23:10.</div>`:"")+`נתוני סגירה ל‑<span class="num">${D.asof}</span> · נסרקו <span class="num">${D.scanned}</span> מניות · עודכן ${D.generated}`;
  document.getElementById("kpis").innerHTML=[["פריצה היום ▲",c("break_up")],["שבירה היום ▼",c("break_down")],["קרוב לפריצה",c("near_up")],["קרוב לשבירה",c("near_down")]].map(([a,b])=>`<div class="kpi"><span>${a}</span><b class="num">${b}</b></div>`).join("");
  const cnt={break_up:c("break_up"),break_down:c("break_down"),near_up:c("near_up"),near_down:c("near_down"),all:D.results.length};
  document.getElementById("tabs").innerHTML=TABS.map(([k,v])=>`<button data-t="${k}">${v}${cnt[k]!=null?`<span class="ct num">${cnt[k]}</span>`:""}</button>`).join("");
  document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;render();});
  if(!cnt.break_up)tab=["break_down","near_up","near_down"].find(k=>cnt[k])||"break_up";
  render();
})();
</script>
</body>
</html>
