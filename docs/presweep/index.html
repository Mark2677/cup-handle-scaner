    <div><span>מרחק מ‑SMA20</span><b class="num">${f(r.sma20_atr)} ATR · ${f(r.sma20_pct)}%</b></div>
    <div><span>תגובות קודמות ל‑SMA20</span><b class="num">${r.sma_react}</b></div>
    <div><span>SMA20 · שיפוע 5 ימים</span><b class="num">$${f(r.sma20)} · ${sg(r.sma20_slope)}</b></div>
    <div><span>ATR(14)</span><b class="num">$${f(r.atr)} · ${f(r.atr_pct)}%</b></div>
    <div><span>גאפ דאון פתוח מעל</span><b class="num">${r.gap?`$${f(r.gap.bottom)}–${f(r.gap.top)} · ${sg(r.gap.dist)}`:"אין"}</b></div>
    <div><span>שווי שוק</span><b class="num">${mc(r.mcap)}</b></div>
    <div><span>ווליום ממוצע 50</span><b class="num">${f(r.vol50/1e6,1)}M · היום ${f(r.vol_ratio)}x</b></div>
    <div><span>RSI(14) · RSI35/EMA10</span><b class="num">${f(r.rsi14,1)} · ${f(r.rsi35_ema10,1)}</b></div>
    <div><span>EMA20 / EMA30</span><b class="num">${f(r.ema20)} / ${f(r.ema30)}</b></div>
    <div><span>EMA50 / EMA200</span><b class="num">${f(r.ema50)} / ${f(r.ema200)}</b></div>
    <div><span>SMA150</span><b class="num">${f(r.sma150)}</b></div>
   </div>
   <div class="tags">${sfTag(r)}<span class="tag ${r.above50?'ok':'no'}">${r.above50?'מעל':'מתחת'} SMA50</span>
    <span class="tag ${r.above200?'ok':'no'}">${r.above200?'מעל':'מתחת'} SMA200</span>
    <a class="tag" href="https://finviz.com/quote.ashx?t=${r.sym}&ty=si" target="_blank" rel="noopener">Finviz ↗</a>
    <a class="tag" href="https://www.tradingview.com/chart/?symbol=${r.sym}&interval=15" target="_blank" rel="noopener">TradingView 15m ↗</a></div></div>`;
}
function filtered(){return D.results.filter(r=>(!q||r.sym.includes(q.toUpperCase())||r.name.toUpperCase().includes(q.toUpperCase()))&&(!sec||r.sector===sec)&&(!ix||r.idx.includes(ix)));}
function filtersBar(){const secs=[...new Set(D.results.map(r=>r.sector))].sort();
  return `<div class="filters"><input id="q" placeholder="חיפוש סימול / שם" value="${q}"><select id="ix"><option value="">כל המדדים</option>${["S&P 500","Nasdaq-100"].map(s=>`<option ${s===ix?'selected':''}>${s}</option>`).join("")}</select><select id="sec"><option value="">כל הסקטורים</option>${secs.map(s=>`<option ${s===sec?'selected':''}>${s}</option>`).join("")}</select></div>`;}
function render(){
  const m=document.getElementById("main");
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));
  if(tab==="method"){m.innerHTML=method();return;}
  if(tab==="hist"){m.innerHTML=hist();return;}
  const rows=filtered();
  if(tab==="all"){
    m.innerHTML=filtersBar()+`<div style="overflow-x:auto"><table><tr><th>סימול</th><th>תרחיש</th><th>סגירה</th><th>שינוי</th><th>רמת התראה</th><th>מרחק ATR</th><th>סוג תמיכה</th><th>SMA20 (ATR)</th><th>תגובות SMA20</th><th>ATR %</th><th>גאפ פתוח</th><th>Short Float</th><th>שווי</th></tr>`+
    rows.map(r=>`<tr><td><b>${r.sym}</b></td><td><span class="badge b-${r.kind}">${KIND[r.kind]}</span></td><td class="num">${f(r.close)}</td><td>${sg(r.chg)}</td><td class="num">${f(r.alert)}</td><td class="num">${f(r.dist_atr)}</td><td>${r.sup?supType(r.sup):"SMA20"}</td><td class="num">${f(r.sma20_atr)}</td><td class="num">${r.sma_react}</td><td class="num">${f(r.atr_pct)}%</td><td>${r.gap?sg(r.gap.dist):"—"}</td><td>${sfTag(r)}</td><td class="num">${mc(r.mcap)}</td></tr>`).join("")+`</table></div>`;
  } else {
    const rs=rows.filter(r=>r.kind===tab);
    m.innerHTML=filtersBar()+(rs.length?`<div class="grid">${rs.map(card).join("")}</div>`:`<div class="empty">אין היום מניות בתרחיש הזה.</div>`);
  }
  const qi=document.getElementById("q");if(qi){qi.oninput=e=>{q=e.target.value;render();const n=document.getElementById("q");n.focus();n.setSelectionRange(q.length,q.length);};}
  const si=document.getElementById("sec");if(si){si.onchange=e=>{sec=e.target.value;render();};}
  const xi=document.getElementById("ix");if(xi){xi.onchange=e=>{ix=e.target.value;render();};}
}
function hist(){
  const cell=(a,cl)=>a?`<span class="num ${cl}">${a.length}</span> · ${a.join(", ")||"—"}`:"—";
  return `<table><tr><th>תאריך</th><th>חפיפה A+B</th><th>A · אופקית</th><th>B · SMA20</th></tr>`+
   D.history.map(h=>`<tr><td class="num">${h.date}</td><td>${cell(h.AB,"")}</td><td>${cell(h.A,"pos")}</td><td>${cell(h.B,"")}</td></tr>`).join("")+`</table>`;
}
function method(){
  const p=D.params,fn=D.funnel;
  return `<div class="prose"><h3>מטרה</h3>
  <p>בסיום יום המסחר מאתרים מניות שנמצאות ממש מעל תמיכה, כך שביום המסחר הבא עשוי להתרחש Liquidity Sweep שורי: פתיל מתחת לתמיכה שנקנה בחזרה. הסריקה רק מכינה את הרשימה ואת רמות ההתראה. הביצוע עצמו בגרף 15 דקות. לונג בלבד.</p>
  <h3>סינון בסיסי</h3>
  <ul><li>עולם: S&P 500 + נאסד"ק 100, בלי כפילויות.</li><li>מחיר מעל $${p.min_price}, ממוצע מחזור 50 יום של לפחות ${f(p.min_vol/1e6,0)}M מניות ביום, שווי שוק מעל $${f(p.min_mcap/1e9,0)}B.</li>
  <li>היום: ${fn.price} מעל המחיר המינימלי ← ${fn.volume} עם מחזור מספיק ← ${fn.setup} עם תרחיש A או B ← ${fn.mcap} אחרי סינון שווי השוק.</li></ul>
  <h3>תרחיש A — תמיכה אופקית</h3>
  <ul><li>רמות לפי פתילים (Low) בעומק של ${p.depths.join(", ")} נרות. שפל = הנמוך ביותר בטווח של ${p.swing} נרות לכל צד.</li>
  <li>תמיכה תקפה: לפחות ${p.min_touches} נגיעות נפרדות (במרחק של לפחות ${p.touch_gap} נרות זו מזו, עד ${p.touch_tol} ATR מעל הרמה), או שפל משמעותי בודד שממנו המחיר עלה לפחות ${p.react_atr} ATR בתוך ${p.react_bars} נרות.</li>
  <li>הרמה שלמה: מאז הנגיעה הראשונה אף פתיל לא ירד מתחתיה, כך שהנזילות מתחתיה עדיין לא נאספה.</li>
  <li>הסגירה של היום מעל התמיכה ובמרחק של עד ${p.near_atr} ATR(14), והפתיל של הנר האחרון לא חצה את הרמה.</li>
  <li>"עומק" בכרטיס הוא החלון הקטן ביותר מבין ${p.depths.join(" / ")} שבו הרמה מופיעה. תמיכה שמופיעה רק ב‑252 היא רמה ארוכת טווח.</li></ul>
  <h3>תרחיש B — תמיכה דינמית ב‑SMA20</h3>
  <ul><li>הסגירה מעל SMA20 ובמרחק של עד ${p.near_atr} ATR, והשפל של היום מעל SMA20.</li>
  <li>קרבה לממוצע לבדה לא מוכיחה שהוא משמש תמיכה. לכן נספרות <b>תגובות קודמות</b> ב‑${p.sma_look} הנרות האחרונים: נר שירד עד ${p.sma_tol} ATR מה‑SMA20, נסגר מעליו, ובתוך ${p.sma_bounce_bars} נרות עלה לפחות ${p.sma_bounce} ATR. ככל שיש יותר תגובות, הממוצע הוכיח את עצמו יותר.</li>
  <li>אם יש תמיכה אופקית במרחק של עד ${p.near_atr} ATR מה‑SMA20, מוצגת חפיפה. מניות שעומדות בשני התרחישים מופיעות בלשונית "חפיפה A+B".</li></ul>
  <h3>נתונים לעיון בלבד, לא מסננים</h3>
  <ul><li><b>גאפ דאון פתוח מעל המחיר:</b> הגאפ הקרוב ביותר שלא נסגר ב‑${p.gap_look} הנרות האחרונים, עם הגבולות והמרחק אליו. גאפ כזה הוא יעד אפשרי אחרי סוויפ.</li>
  <li><b>Short Float:</b> מ‑Yahoo. מעל ${p.short_mid}% מסומן בכתום, מעל ${p.short_hi}% באדום.</li>
  <li>ATR(14) בדולרים ובאחוזים, מרחק מ‑SMA20 ומהתמיכה באחוזים וב‑ATR, וסוג התמיכה.</li></ul>
  <h3>רמת ודאות ומקורות</h3>
  <p>מחירים, ממוצעים, ATR וגאפים <span class="conf c-f">עובדה</span>, מ‑Yahoo Finance, מתואמים לפיצולים בלבד כמו ב‑TradingView וב‑Finviz.</p>
  <p>Short Float ושווי שוק מ‑Yahoo, ומתעדכנים פעם בשבוע. Yahoo ו‑Finviz מחשבים את ה‑Float אחרת, ולכן ה‑Short Float עשוי להיות שונה. כשיש סתירה, הנתון של Finviz שתביא קובע <span class="conf c-e">הערכה</span>.</p>
  <p>זיהוי התמיכה הוא אלגוריתמי <span class="conf c-e">הסקה</span>, וכדאי לאשר את הרמה בגרף לפני שמגדירים התראה.</p>
  <p class="sub">מקור הרשימות: ${D.source} · נסרקו ${D.scanned} מתוך ${D.universe}${D.stale?` · ${D.stale} ללא נר של היום`:""} · נוצר ${D.generated}</p></div>`;
}
(function init(){
  const c=k=>D.results.filter(r=>r.kind===k).length;
  document.getElementById("sub").innerHTML=(D.intraday?`<div style="background:#d2992226;color:#d29922;padding:8px 12px;border-radius:8px;margin-bottom:6px">⚠️ הרצת בדיקה במהלך יום המסחר. הנתונים חלקיים ויוחלפו בסריקה של 23:10.</div>`:"")+`נתוני סגירה ל‑<span class="num">${D.asof}</span> · נסרקו <span class="num">${D.scanned}</span> מניות · לונג בלבד · ביצוע בגרף 15 דקות · עודכן ${D.generated}`;
  const sfc=D.results.filter(r=>r.short_float!=null&&r.short_float>=D.params.short_mid).length;
  document.getElementById("kpis").innerHTML=[["חפיפה A+B",c("AB")],["A · תמיכה אופקית",c("A")],["B · SMA20",c("B")],["עם גאפ פתוח מעל",D.results.filter(r=>r.gap).length],[`Short Float ≥ ${D.params.short_mid}%`,sfc]].map(([a,b])=>`<div class="kpi"><span>${a}</span><b class="num">${b}</b></div>`).join("");
  const cnt={AB:c("AB"),A:c("A"),B:c("B"),all:D.results.length};
  document.getElementById("tabs").innerHTML=TABS.map(([k,v])=>`<button data-t="${k}">${v}${cnt[k]!=null?`<span class="ct num">${cnt[k]}</span>`:""}</button>`).join("");
  document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;render();});
  if(!cnt.AB)tab=cnt.A?"A":"B";
  render();
})();
</script>
