   <div class="st" style="margin-top:8px">
    ${pre?`<div><span>ATR(14)</span><b class="num">${f(r.atr)}</b></div>`:`<div><span>נגיעה ברצועה ${band}</span><b>${ago(r.touch_ago)}</b></div>`}
    <div><span>${pre?"SAR (רמת היפוך)":"SAR (סטופ)"}</span><b class="num">${f(r.sar)}</b></div>
    <div><span>מרחק ל‑SAR</span><b>${sg(r.sar_dist)}</b></div>
    <div><span>BB עליונה / תחתונה</span><b class="num">${f(r.bb_up)} / ${f(r.bb_lo)}</b></div>
    <div><span>%B</span><b class="num">${f(r.pctb,1)}</b></div>
    <div><span>רוחב רצועה</span><b class="num">${f(r.bw)}%</b></div>
    <div><span>ווליום / ממוצע 50</span><b class="num">${f(r.vol_ratio)}x</b></div>
    <div><span>RSI(14)</span><b class="num">${f(r.rsi14,1)}</b></div>
    <div><span>RSI(35)/EMA(10)</span><b class="num">${f(r.rsi35_ema10,1)}</b></div>
    <div><span>EMA20 / EMA30</span><b class="num">${f(r.ema20)} / ${f(r.ema30)}</b></div>
    <div><span>EMA50 / EMA200</span><b class="num">${f(r.ema50)} / ${f(r.ema200)}</b></div>
    <div><span>SMA150</span><b class="num">${f(r.sma150)}</b></div>
   </div>
   <div class="tags"><span class="tag ${r.above50?'ok':'no'}">${r.above50?'מעל':'מתחת'} SMA50</span>
    <span class="tag ${r.above200?'ok':'no'}">${r.above200?'מעל':'מתחת'} SMA200</span>
    <a class="tag" href="https://finviz.com/quote.ashx?t=${r.sym}" target="_blank" rel="noopener">Finviz ↗</a>
    <a class="tag" href="https://www.tradingview.com/chart/?symbol=${r.sym}" target="_blank" rel="noopener">TradingView ↗</a></div></div>`;
}
function filtered(){return D.results.filter(r=>(!q||r.sym.includes(q.toUpperCase())||r.name.toUpperCase().includes(q.toUpperCase()))&&(!sec||r.sector===sec));}
function filtersBar(){const secs=[...new Set(D.results.map(r=>r.sector))].sort();
  return `<div class="filters"><input id="q" placeholder="חיפוש סימול / שם" value="${q}"><select id="sec"><option value="">כל הסקטורים</option>${secs.map(s=>`<option ${s===sec?'selected':''}>${s}</option>`).join("")}</select></div>`;}
function render(){
  const m=document.getElementById("main");
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));
  if(tab==="method"){m.innerHTML=method();return;}
  if(tab==="hist"){m.innerHTML=hist();return;}
  const rows=filtered();
  if(tab==="all"){
    m.innerHTML=filtersBar()+`<div style="overflow-x:auto"><table><tr><th>סימול</th><th>כיוון</th><th>סגירה</th><th>שינוי</th><th>נגיעה / מרחק</th><th>SAR</th><th>מרחק SAR</th><th>%B</th><th>ווליום</th><th>RSI14</th><th>SMA200</th><th>סקטור</th></tr>`+
    rows.map(r=>`<tr><td><b>${r.sym}</b></td><td><span class="badge b-${r.kind}">${KIND[r.kind]}</span></td><td class="num">${f(r.close)}</td><td>${sg(r.chg)}</td><td>${r.kind.startsWith("pre_")?`<span class="num">${f(r.dist_atr)}</span> ATR`:ago(r.touch_ago)}</td><td class="num">${f(r.sar)}</td><td>${sg(r.sar_dist)}</td><td class="num">${f(r.pctb,0)}</td><td class="num">${f(r.vol_ratio)}x</td><td class="num">${f(r.rsi14,0)}</td><td>${r.above200?'מעל':'מתחת'}</td><td>${r.sector}</td></tr>`).join("")+`</table></div>`;
  } else {
    const rs=rows.filter(r=>r.kind===tab);
    m.innerHTML=filtersBar()+(rs.length?`<div class="grid">${rs.map(card).join("")}</div>`:`<div class="empty">אין מניות שעונות על התנאים בכיוון הזה היום.</div>`);
  }
  const qi=document.getElementById("q");if(qi){qi.oninput=e=>{q=e.target.value;render();const n=document.getElementById("q");n.focus();n.setSelectionRange(q.length,q.length);};}
  const si=document.getElementById("sec");if(si){si.onchange=e=>{sec=e.target.value;render();};}
}
function hist(){
  const cell=(a,cl)=>a?`<span class="num ${cl}">${a.length}</span> · ${a.join(", ")||"—"}`:"—";
  return `<table><tr><th>תאריך</th><th>לפני סוויפ · לונג</th><th>לפני סוויפ · שורט</th><th>אות לונג ▲</th><th>אות שורט ▼</th></tr>`+
   D.history.map(h=>`<tr><td class="num">${h.date}</td><td>${cell(h.pre_long,"")}</td><td>${cell(h.pre_short,"")}</td><td>${cell(h.long,"pos")}</td><td>${cell(h.short,"neg")}</td></tr>`).join("")+`</table>`;
}
function method(){
  const p=D.params;
  return `<div class="prose"><h3>מה הסורק בודק</h3>
  <p>בכל יום מסחר בשעה 23:10 שעון ישראל, אחרי הסגירה בוול סטריט, נסרקות כל מניות ה‑S&P 500 על נרות יומיים.</p>
  <ul><li><b>לונג ▲:</b> (1) באחד מ‑${p.window} ימי המסחר האחרונים השפל נגע ברצועת הבולינגר התחתונה או ירד מתחתיה. (2) הסגירה של היום חזרה אל תוך הרצועות, בין התחתונה לעליונה. (3) היום ה‑Parabolic SAR התהפך מעל המחיר אל מתחתיו.</li>
  <li><b>שורט ▼:</b> בדיוק ההפך. השיא נגע ברצועה העליונה, הסגירה חזרה אל תוך הרצועות, וה‑SAR התהפך אל מעל המחיר.</li>
  <li><b>בולינגר:</b> ממוצע SMA של ${p.bb_len} ימים, ±${p.bb_mult} סטיות תקן (סטיית תקן של אוכלוסייה, כמו ב‑TradingView).</li>
  <li><b>Parabolic SAR:</b> התחלה ${p.sar[0]}, צעד ${p.sar[1]}, מקסימום ${p.sar[2]}. החישוב הוא העתקה מדויקת של ta.sar ב‑TradingView. ערך ה‑SAR של היום יכול לשמש כרמת סטופ.</li>
  <li><b>מיון:</b> לפי יחס הווליום של היום לממוצע 50 הימים.</li></ul>
  <h3>לפני הסוויפ (רשימת מעקב)</h3>
  <ul><li><b>לונג:</b> הסגירה של היום מעל הרצועה התחתונה ובמרחק של עד ${p.pre_atr} ATR(14) ממנה, השפל של היום עוד לא נגע בה, ו‑%B ירד ${p.pre_days} ימים ברצף, כלומר המחיר בדרך אל הרצועה.${p.pre_sar?" ה‑SAR עדיין מעל המחיר, ולכן סוויפ שאחריו היפוך יהפוך אותו ויוליד אות מלא.":""}</li>
  <li><b>שורט:</b> בדיוק ההפך, על הרצועה העליונה.</li>
  <li><b>רמת ההתראה</b> היא ערך הרצועה הערב. מחר הרצועה תזוז מעט עם הסגירה, בדרך כלל בשבר אחוז <span class="conf c-e">הסקה</span>. המיון הוא לפי המרחק מהרצועה ב‑ATR, מהקרוב לרחוק.</li>
  <li>מניה שמופיעה כאן ואחרי יום או יומיים עוברת ללשונית "אות", השלימה את התבנית: סוויפ, חזרה פנימה, והיפוך SAR.</li></ul>
  <h3>רמת ודאות ומקורות</h3>
  <p>מחירים, רצועות, SAR ו‑RSI <span class="conf c-f">עובדה</span>, מ‑Yahoo Finance. המחירים מתואמים לפיצולים בלבד ולא לדיבידנדים, כמו ברירת המחדל ב‑TradingView וב‑Finviz.</p>
  <p>ה‑SAR תלוי בכל ההיסטוריה שקדמה לו. הסורק מחשב אותו על כ‑14 חודשים, ו‑TradingView על כל ההיסטוריה הזמינה, ולכן ייתכנו הבדלים קטנים מאוד בערך. מועד ההיפוך עצמו כמעט תמיד זהה <span class="conf c-e">הערכה</span>.</p>
  <p>ההגדרה ${p.sar.join("/")} אגרסיבית יותר מברירת המחדל (0.02/0.02/0.2), ולכן ה‑SAR מתהפך לעיתים קרובות ויש יותר אותות שווא <span class="conf c-e">הסקה</span>.</p>
  <p class="sub">מקור הרשימה: ${D.source} · נסרקו ${D.scanned} מתוך ${D.universe}${D.stale?` · ${D.stale} ללא נר של היום`:""} · נוצר ${D.generated}</p></div>`;
}
(function init(){
  const c=k=>D.results.filter(r=>r.kind===k).length;
  document.getElementById("sub").innerHTML=(D.intraday?`<div style="background:#d2992226;color:#d29922;padding:8px 12px;border-radius:8px;margin-bottom:6px">⚠️ הרצת בדיקה במהלך יום המסחר. הנתונים חלקיים ויוחלפו בסריקה של 23:10.</div>`:"")+`נתוני סגירה ל‑<span class="num">${D.asof}</span> · נסרקו <span class="num">${D.scanned}</span> מניות · BB ${D.params.bb_len}/${D.params.bb_mult} · SAR ${D.params.sar.join("/")} · עודכן ${D.generated}`;
  document.getElementById("kpis").innerHTML=[["לפני סוויפ · לונג",c("pre_long")],["לפני סוויפ · שורט",c("pre_short")],["אות לונג ▲",c("long")],["אות שורט ▼",c("short")]].map(([a,b])=>`<div class="kpi"><span>${a}</span><b class="num">${b}</b></div>`).join("");
  const cnt={pre_long:c("pre_long"),pre_short:c("pre_short"),long:c("long"),short:c("short"),all:D.results.length};
  document.getElementById("tabs").innerHTML=TABS.map(([k,v])=>`<button data-t="${k}">${v}${cnt[k]!=null?`<span class="ct num">${cnt[k]}</span>`:""}</button>`).join("");
  document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;render();});
  if(!cnt.pre_long)tab=["pre_short","long","short"].find(k=>cnt[k])||"pre_long";
  render();
})();
</script>
