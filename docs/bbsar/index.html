function chart(r){
  const k=r.chart,n=k.c.length,W=340,H=160,pad=6;
  const all=[...k.h,...k.l,...k.up,...k.lo,...k.sar].filter(x=>x!=null),lo=Math.min(...all),hi=Math.max(...all);
  const X=i=>pad+(W-2*pad)*i/(n-1),Y=v=>H-pad-(H-2*pad)*(v-lo)/(hi-lo);
  const line=(a,col,w,dash)=>{let p="",m=true;a.forEach((v,i)=>{if(v==null){m=true;return;}p+=`${m?'M':'L'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`;m=false;});return `<path d="${p}" fill="none" stroke="${col}" stroke-width="${w}" ${dash?'stroke-dasharray="3 3"':''}/>`;};
  let band="";{const top=k.up.map((v,i)=>v==null?null:[X(i),Y(v)]).filter(Boolean),bot=k.lo.map((v,i)=>v==null?null:[X(i),Y(v)]).filter(Boolean).reverse();
    band=`<path d="M${[...top,...bot].map(p=>p.map(z=>z.toFixed(1)).join(",")).join("L")}Z" fill="#58a6ff12"/>`;}
  const wick=k.c.map((v,i)=>`<line x1="${X(i)}" x2="${X(i)}" y1="${Y(k.h[i])}" y2="${Y(k.l[i])}" stroke="#8b98a866" stroke-width="1"/>`).join("");
  const dots=k.sar.map((v,i)=>v==null?"":`<circle cx="${X(i)}" cy="${Y(v)}" r="${i===n-1?3.5:1.6}" fill="${k.below[i]?'#3fb950':'#f85149'}"/>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="גרף ${r.sym}">${band}
   ${line(k.up,"#58a6ff",1.1)}${line(k.lo,"#58a6ff",1.1)}${line(k.mid,"#58a6ff88",1,true)}${wick}${line(k.c,"#e6edf3",1.4)}${dots}</svg>

}
function card(r){

function filtered(){return D.results.filter(r=>(!q||r.sym.includes(q.toUpperCase())||r.name.toUpperCase().includes(q.toUpperCase()))&&(!sec||r.sector===sec));}
function filtersBar(){const secs=[...new Set(D.results.map(r=>r.sector))].sort();

function render(){
