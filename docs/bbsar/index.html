  <li><b>שורט ▼:</b> בדיוק ההפך. השיא נגע ברצועה העליונה, הסגירה חזרה אל תוך הרצועות, וה‑SAR התהפך אל מעל המחיר.</li>
  <li><b>בולינגר:</b> ממוצע SMA של ${p.bb_len} ימים, ±${p.bb_mult} סטיות תקן (סטיית תקן של אוכלוסייה, כמו ב‑TradingView).</li>
  <li><b>Parabolic SAR:</b> התחלה ${p.sar[0]}, צעד ${p.sar[1]}, מקסימום ${p.sar[2]}. החישוב הוא העתקה מדויקת של ta.sar ב‑TradingView. ערך ה‑SAR של היום יכול לשמש כרמת סטופ.</li>
  <li><b>מיון:</b> לפי יחס הווליום של היום לממוצע 50 הימים.</li></ul>
  <h3>רמת ודאות ומקורות</h3>
  <p>מחירים, רצועות, SAR ו‑RSI <span class="conf c-f">עובדה</span>, מ‑Yahoo Finance. המחירים מתואמים לפיצולים בלבד ולא לדיבידנדים, כמו ברירת המחדל ב‑TradingView וב‑Finviz.</p>
  <p>ה‑SAR תלוי בכל ההיסטוריה שקדמה לו. הסורק מחשב אותו על כ‑14 חודשים, ו‑TradingView על כל ההיסטוריה הזמינה, ולכן ייתכנו הבדלים קטנים מאוד בערך. מועד ההיפוך עצמו כמעט תמיד זהה <span class="conf c-e">הערכה</span>.</p>
  <p>ההגדרה ${p.sar.join("/")} אגרסיבית יותר מברירת המחדל (0.02/0.02/0.2), ולכן ה‑SAR מתהפך לעיתים קרובות ויש יותר אותות שווא <span class="conf c-e">הסקה</span>.</p>
  <p class="sub">מקור הרשימה: ${D.source} · נסרקו ${D.scanned} מתוך ${D.universe}${D.stale?` · ${D.stale} ללא נר של היום`:""} · נוצר ${D.generated}</p></div>`;
}
(function init(){
  const c=k=>D.results.filter(r=>r.kind===k).length;
  document.getElementById("sub").innerHTML=(D.intraday?`<div style="background:#d2992226;color:#d29922;padding:8px 12px;border-radius:8px;margin-bottom:6px">⚠️ הרצת בדיקה במהלך יום המסחר. הנתונים חלקיים ויוחלפו בסריקה של 23:10.</div>`:"")+`נתוני סגירה ל‑<span class="num">${D.asof}</span> · נסרקו <span class="num">${D.scanned}</span> מניות · BB ${D.params.bb_len}/${D.params.bb_mult} · SAR ${D.params.sar.join("/")} · עודכן ${D.generated}`;
  document.getElementById("kpis").innerHTML=[["אותות היום",D.results.length],["לונג ▲",c("long")],["שורט ▼",c("short")]].map(([a,b])=>`<div class="kpi"><span>${a}</span><b class="num">${b}</b></div>`).join("");
  const cnt={long:c("long"),short:c("short"),all:D.results.length};
  document.getElementById("tabs").innerHTML=TABS.map(([k,v])=>`<button data-t="${k}">${v}${cnt[k]!=null?`<span class="ct num">${cnt[k]}</span>`:""}</button>`).join("");
  document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;render();});
  if(!cnt.long&&cnt.short)tab="short";
  render();
})();
</script>
