(function init(){
  const c=k=>D.results.filter(r=>r.kind===k).length;
  document.getElementById("sub").innerHTML=(D.intraday?`<div style="background:#d2992226;color:#d29922;padding:8px 12px;border-radius:8px;margin-bottom:6px">⚠️ הרצת בדיקה במהלך יום המסחר. הנתונים חלקיים ויוחלפו בסריקה של 23:10.</div>`:"")+`נתוני סגירה ל‑<span class="num">${D.asof}</span> · נסרקו <span class="num">${D.scanned}</span> מניות · BB ${D.params.bb_len}/${D.params.bb_mult} · SAR ${D.params.sar.join("/")} · עודכן ${D.generated}`;
  document.getElementById("kpis").innerHTML=[["אותות היום",D.results.length],["לונג ▲",c("long")],["שורט ▼",c("short")]].map(([a,b])=>`<div class="kpi"><span>${a}</span><b class="num">${b}</b></div>`).join("");
  const cnt={long:c("long"),short:c("short"),all:D.results.length};
  document.getElementById("tabs").innerHTML=TABS.map(([k,v])=>`<button data-t="${k}">${v}${cnt[k]!=null?`<span class="ct num">${cnt[k]}</span>`:""}</button>`).join("");
  document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;render();});
  if(!cnt.long&&cnt.short)tab="short";
  render();
})();
</script>
</body>
</html>
