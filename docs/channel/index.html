<style>
:root{--bg:#0d1117;--panel:#161b22;--panel2:#1c2330;--line:#2a3340;--txt:#e6edf3;--mut:#8b98a8;

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}

.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.sym{font-size:20px;font-weight:700}
.nm{color:var(--mut);font-size:12px}
.badge{font-size:12px;padding:3px 9px;border-radius:20px;white-space:nowrap}
.b-breakout{background:#3fb95026;color:var(--grn)}.b-above{background:#58a6ff26;color:var(--blu)}

.st{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 10px;font-size:12px}
.st div>span{color:var(--mut);display:block}
.st div b{font-weight:600}
.tags{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;border:1px solid var(--line);border-radius:6px;padding:2px 6px;color:var(--mut)}
.tag.ok{color:var(--grn);border-color:#3fb95055}.tag.no{color:var(--red);border-color:#f8514955}
.empty{color:var(--mut);padding:40px;text-align:center;background:var(--panel);border-radius:12px}
.pos{color:var(--grn)}.neg{color:var(--red)}
table{width:100%;border-collapse:collapse;background:var(--panel);border-radius:12px;overflow:hidden;font-size:13px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right}
th{color:var(--mut);font-weight:500}
.prose{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;line-height:1.7}
.prose h3{margin-top:0}
.conf{font-size:11px;padding:1px 6px;border-radius:5px;margin-inline-start:6px}
.c-f{background:#3fb95022;color:var(--grn)}.c-e{background:#d2992222;color:var(--amb)}
.filters{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.filters input,.filters select{background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:7px 10px;font:inherit}
a{color:var(--blu)}

  <p>בכל יום מסחר בשעה 23:10 שעון ישראל נסרקות כל המניות של S&P 500, נאסד"ק 100 ודאו ג'ונס 30 (מניה שנמצאת בכמה מדדים נסרקת פעם אחת), על נרות יומיים.</p>
  <ul><li><b>איך נבנית תעלה:</b> כמו שמשרטטים ידנית. קו אחד עובר דרך שתי תחתיות (או שני שיאים) בטווח של ${p.min_len} עד ${p.max_len} ימי מסחר (כ‑2 עד 6 חודשים), עם לפחות ${p.min_gap} ימים ביניהן. הקו השני מקביל לו ועובר דרך הקצה הנגדי של אותה תקופה. תחתית או שיא = הנקודה הקיצונית ביותר בטווח של ${p.swing} נרות לכל צד.</li>
  <li><b>תנאים לתעלה תקפה:</b> כל הנרות מאז הנקודה הראשונה בתוך התעלה. פתיל רשאי לחרוג עד ${p.pierce} ATR וסגירה עד ${p.close_out} ATR. לפחות ${p.min_side} נגיעות נפרדות בכל קו ולפחות ${p.min_total} בסך הכול, לא כולל היום (נגיעה = עד ${p.touch} ATR מהקו). כל קו נבדק גם בחצי הראשון וגם בחצי השני של חיי התעלה, ומגמת הסגירות עצמה היא לפחות ${(p.follow||0.5)*100}% מהשיפוע של התעלה, כדי שתעלה רחבה שהמחיר נע בה הצידה לא תיחשב. רוחב של לפחות ${p.min_width} ATR. והתעלה באמת משופעת: העלייה או הירידה לאורך חייה היא לפחות ${p.trend} מהרוחב שלה, כך שתעלה אופקית לא נכללת.</li>
  <li><b>בחירת התעלה:</b> מכל המועמדות נבחרת התעלה עם הכי הרבה נגיעות, ובשוויון הארוכה יותר. רק אז נבדק אם המחיר בגבול, כדי שלא לבחור תעלה "נוחה".</li>
  <li><b>"בגבול":</b> הסגירה של היום בתוך התעלה ובמרחק של עד ${p.near_in} ATR(14) מהקו, או מעט מחוצה לו, עד ${p.near_out} ATR. סגירה רחוקה יותר מחוץ לתעלה היא כבר פריצה או שבירה, ולא מופיעה.</li>
  <li><b>ארבעה מצבים:</b> עולה + בתחתית (עם המגמה, לונג), יורדת + בגבול העליון (עם המגמה, שורט), ושני מצבים נגד המגמה: עולה + בגבול העליון ויורדת + בתחתית.</li>
  <li><b>מיון:</b> מהקרוב לקו אל הרחוק, ובשוויון לפי מספר הנגיעות.</li></ul>
  <h3>רמת ודאות ומקורות</h3>
  <p>מחירים, ATR ו‑RSI <span class="conf c-f">עובדה</span>, מ‑Yahoo Finance. המחירים מתואמים לפיצולים בלבד, כמו ב‑TradingView וב‑Finviz.</p>
  <p>התעלה עצמה היא פרשנות <span class="conf c-e">הסקה</span>. סוחר שמשרטט ידנית עשוי לבחור נקודות עיגון אחרות ולקבל קו שונה במעט. כדאי לאשר בגרף לפני כניסה. רמת הקו היא הערך של היום; בתעלה משופעת הקו זז מדי יום לפי השיפוע.</p>
  <p class="sub">מקור הרשימות: ${D.source} · נסרקו ${D.scanned} מתוך ${D.universe}${D.stale?` · ${D.stale} ללא נר של היום`:""} · ${D.with_channel} מניות נמצאות כרגע בתעלה תקפה · נוצר ${D.generated}</p></div>`;
}
(function init(){
  const c=k=>D.results.filter(r=>r.kind===k).length;
  document.getElementById("sub").innerHTML=(D.intraday?`<div style="background:#d2992226;color:#d29922;padding:8px 12px;border-radius:8px;margin-bottom:6px">⚠️ הרצת בדיקה במהלך יום המסחר. הנתונים חלקיים ויוחלפו בסריקה של 23:10.</div>`:"")+`נתוני סגירה ל‑<span class="num">${D.asof}</span> · נסרקו <span class="num">${D.scanned}</span> מניות · <span class="num">${D.with_channel}</span> בתעלה תקפה · עודכן ${D.generated}`;
  document.getElementById("kpis").innerHTML=[["בתעלה תקפה",D.with_channel],["עולה · בתחתית",c("up_low")],["עולה · בגבול העליון",c("up_high")],["יורדת · בתחתית",c("down_low")],["יורדת · בגבול העליון",c("down_high")]].map(([a,b])=>`<div class="kpi"><span>${a}</span><b class="num">${b}</b></div>`).join("");
  const cnt={up_low:c("up_low"),up_high:c("up_high"),down_low:c("down_low"),down_high:c("down_high"),all:D.results.length};
  document.getElementById("tabs").innerHTML=TABS.map(([k,v])=>`<button data-t="${k}">${v}${cnt[k]!=null?`<span class="ct num">${cnt[k]}</span>`:""}</button>`).join("");
  document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;render();});
  if(!cnt.up_low)tab=["down_high","up_high","down_low"].find(k=>cnt[k])||"up_low";
  render();
})();
