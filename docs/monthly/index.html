.st div b{font-weight:600}

  const c=k=>D.results.filter(r=>r.kind===k).length;
  document.getElementById("sub").innerHTML=(D.intraday?`<div style="background:#d2992226;color:#d29922;padding:8px 12px;border-radius:8px;margin-bottom:6px">⚠️ הרצת בדיקה במהלך יום המסחר. הנתונים חלקיים ויוחלפו בסריקה של 23:10.</div>`:"")+`נתוני סגירה ל‑<span class="num">${D.asof}</span> · נסרקו <span class="num">${D.scanned}</span> מניות · עודכן ${D.generated}`;
  document.getElementById("warn").innerHTML=D.last_day?`<div class="warn" style="background:#3fb95022;color:var(--grn)">✅ היום הוא יום המסחר האחרון של החודש: החציות של החודש נסגרו עם הנר.</div>`:`<div class="warn">⏳ החודש פתוח (יום מסחר ${D.month_days} בחודש). חציות "החודש" זמניות עד הסגירה החודשית.</div>`;
  document.getElementById("kpis").innerHTML=[["גולדן קרוס החודש",c("golden")],["דת' קרוס החודש",c("death")],["גולדן · חודש קודם",c("golden_conf")],["דת' · חודש קודם",c("death_conf")]].map(([a,b])=>`<div class="kpi"><span>${a}</span><b class="num">${b}</b></div>`).join("");
  const cnt={golden:c("golden"),death:c("death"),golden_conf:c("golden_conf"),death_conf:c("death_conf"),all:D.results.length};
  document.getElementById("tabs").innerHTML=TABS.map(([k,v])=>`<button data-t="${k}">${v}${cnt[k]!=null?`<span class="ct num">${cnt[k]}</span>`:""}</button>`).join("");
  document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;render();});
  if(!cnt.golden)tab=["death","golden_conf","death_conf"].find(k=>cnt[k])||"golden";
  render();
})();
