name: Daily cup-and-handle scan

on:
  schedule:
    # 21:30 UTC, Mon-Fri = after the US close all year round
    # (23:30 Israel winter time / 00:30 Israel summer time)
    - cron: "30 21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scanner.py
      - name: Publish results
        run: |
          git config user.name  "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "Scan results $(date -u +%F)"
          git push
