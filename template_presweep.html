<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>סורק Pre-Sweep לונג</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1117;--panel:#161b22;--panel2:#1c2330;--line:#2a3340;--txt:#e6edf3;--mut:#8b98a8;
--grn:#3fb950;--red:#f85149;--amb:#d29922;--blu:#58a6ff;--pur:#bc8cff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:Heebo,system-ui,sans-serif;font-size:15px}
.num{font-family:"JetBrains Mono",monospace;direction:ltr;unicode-bidi:isolate}
header{padding:22px 16px 10px;max-width:1200px;margin:auto}
h1{margin:0;font-size:24px}
.sub{color:var(--mut);margin-top:6px;font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
.kpi b{display:block;font-size:24px;margin-top:4px}
.kpi span{color:var(--mut);font-size:12px}
nav{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
nav .in{max-width:1200px;margin:auto;display:flex;gap:4px;overflow-x:auto;padding:0 16px}
nav button{background:none;border:0;color:var(--mut);padding:12px 14px;font:inherit;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent}
nav button.on{color:var(--txt);border-color:var(--blu)}
nav .ct{background:var(--panel2);border-radius:9px;padding:1px 7px;font-size:12px;margin-inline-start:5px}
main{max-width:1200px;margin:auto;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.sym{font-size:20px;font-weight:700}
.nm{color:var(--mut);font-size:12px}
.badge{font-size:12px;padding:3px 9px;border-radius:20px;white-space:nowrap}
.b-breakout{background:#3fb95026;color:var(--grn)}.b-above{background:#58a6ff26;color:var(--blu)}
.b-near{background:#d2992226;color:var(--amb)}.b-forming{background:#8b98a826;color:var(--mut)}
svg{width:100%;height:150px;display:block;margin:10px 0 6px}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 10px;font-size:12px}
.st div>span{color:var(--mut);display:block}
.st div b{font-weight:600}
.tags{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;border:1px solid var(--line);border-radius:6px;padding:2px 6px;color:var(--mut)}
.tag.ok{color:var(--grn);border-color:#3fb95055}.tag.no{color:var(--red);border-color:#f8514955}
.empty{color:var(--mut);padding:40px;text-align:center;background:var(--panel);border-radius:12px}
.pos{color:var(--grn)}.neg{color:var(--red)}
table{width:100%;border-collapse:collapse;background:var(--panel);border-radius:12px;overflow:hidden;font-size:13px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right}
th{color:var(--mut);font-weight:500}
.prose{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;line-height:1.7}
.prose h3{margin-top:0}
.conf{font-size:11px;padding:1px 6px;border-radius:5px;margin-inline-start:6px}
.c-f{background:#3fb95022;color:var(--grn)}.c-e{background:#d2992222;color:var(--amb)}
.filters{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.filters input,.filters select{background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:7px 10px;font:inherit}
a{color:var(--blu)}
@media(max-width:420px){.grid{grid-template-columns:1fr}}
</style>
<style>
.b-AB{background:#bc8cff2e;color:var(--pur)}.b-A{background:#3fb95026;color:var(--grn)}.b-B{background:#58a6ff26;color:var(--blu)}
.sf-hi{background:#f85149;color:#0d1117;font-weight:700}.sf-mid{background:#d29922;color:#0d1117;font-weight:700}
.ix{font-size:10px;border:1px solid var(--line);border-radius:5px;padding:1px 5px;color:var(--mut);margin-inline-start:4px}
.alert{background:var(--panel2);border:1px dashed var(--line);border-radius:8px;padding:8px 10px;margin-top:8px;font-size:13px}
.legend{display:flex;gap:12px;font-size:11px;color:var(--mut);flex-wrap:wrap}.legend i{display:inline-block;width:14px;height:2px;vertical-align:middle;margin-inline-end:4px}
.xnav{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin-top:8px}
</style>
</head>
<body>
<header>
  <h1>🧲 Pre-Sweep Scanner | LONG — S&amp;P 500 · נאסד"ק 100</h1>
  <div class="sub" id="sub"></div>
  <div class="xnav"><a href="../trend/">📈 חציית EMA30/50</a><a href="../cross20/">✂️ EMA20/SMA20 + RSI10</a><a href="../channel/">📐 תעלות מחיר</a><a href="../squeeze/">🗜️ התכווצות בולינגר</a><a href="../presweep/">🧲 Pre-Sweep לונג</a><a href="../r2k/">🔎 ראסל 2000 · שורט + ביסוס</a></div>
  <div class="kpis" id="kpis"></div>
</header>
<nav><div class="in" id="tabs"></div></nav>
<main id="main"></main>
<script>
const D = /*__DATA__*/null;
const KIND={AB:"חפיפה: אופקית + SMA20",A:"A · תמיכה אופקית",B:"B · SMA20"};
const TABS=[["AB","🟣 חפיפה A+B"],["A","🟢 A · תמיכה אופקית"],["B","🔵 B · SMA20"],["all","טבלה מלאה"],["hist","היסטוריה"],["method","מתודולוגיה"]];
let tab="AB",q="",sec="",ix="";
const f=(x,d=2)=>x==null?"—":Number(x).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
const sg=x=>x==null?"—":`<span class="num ${x>=0?'pos':'neg'}">${x>=0?'+':''}${f(x)}%</span>`;
const mc=x=>x==null?"—":x>=1e12?`$${f(x/1e12,2)}T`:`$${f(x/1e9,1)}B`;
const sfTag=r=>r.short_float==null?`<span class="tag">Short Float —</span>`:`<span class="tag ${r.short_float>=D.params.short_hi?'sf-hi':r.short_float>=D.params.short_mid?'sf-mid':''}">Short Float ${f(r.short_float,1)}%</span>`;
const supType=s=>!s?"—":s.type==="multi"?`${s.touches} נגיעות`:`שפל בודד · תגובה ${f(s.rally,1)} ATR`;
function chart(r){
  const k=r.chart,n=k.c.length,W=340,H=170,pad=6;
  const lvl=r.sup?r.sup.level:null;
  const all=[...k.h,...k.l,...k.sma.filter(x=>x!=null),...(lvl?[lvl]:[]),...(k.gap?[k.gap[2]]:[])],lo=Math.min(...all),hi=Math.max(...all);
  const X=i=>pad+(W-2*pad)*i/(n-1),Y=v=>H-pad-(H-2*pad)*(v-lo)/(hi-lo);
  const line=(a,col,w)=>{let p="",m=true;a.forEach((v,i)=>{if(v==null){m=true;return;}p+=`${m?'M':'L'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`;m=false;});return `<path d="${p}" fill="none" stroke="${col}" stroke-width="${w}"/>`;};
  const wick=k.c.map((v,i)=>`<line x1="${X(i)}" x2="${X(i)}" y1="${Y(k.h[i])}" y2="${Y(k.l[i])}" stroke="#8b98a866" stroke-width="1"/>`).join("");
  const gap=k.gap?`<rect x="${X(k.gap[0])}" y="${Y(k.gap[2])}" width="${X(n-1)-X(k.gap[0])}" height="${Math.max(1,Y(k.gap[1])-Y(k.gap[2]))}" fill="#f8514926"/>`:"";
  const lv=lvl?`<line x1="${X(k.first||0)}" x2="${X(n-1)}" y1="${Y(lvl)}" y2="${Y(lvl)}" stroke="#3fb950" stroke-width="1.4" stroke-dasharray="4 3"/>`:"";
  const tc=k.touch.map(i=>`<circle cx="${X(i)}" cy="${Y(k.l[i])}" r="2.8" fill="none" stroke="#d29922" stroke-width="1.3"/>`).join("");
  const rc=k.react.map(i=>`<circle cx="${X(i)}" cy="${Y(k.l[i])}" r="2.4" fill="#58a6ff"/>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="גרף ${r.sym}">${gap}${lv}${line(k.sma,"#58a6ff",1.3)}${wick}${line(k.c,"#e6edf3",1.3)}${tc}${rc}<circle cx="${X(n-1)}" cy="${Y(k.c[n-1])}" r="3.4" fill="#bc8cff"/></svg>
   <div class="legend"><span><i style="background:#3fb950"></i>תמיכה אופקית</span><span><i style="background:#58a6ff"></i>SMA20</span><span>○ <b style="color:#d29922">נגיעות</b></span><span>● <b style="color:#58a6ff">תגובות ל‑SMA20</b></span>${k.gap?`<span><i style="background:#f8514966;height:8px"></i>גאפ פתוח</span>`:""}</div>`;
}
function card(r){
  const s=r.sup;
  return `<div class="card"><div class="top"><div><div class="sym">${r.sym}</div><div class="nm">${r.name} · ${r.sector}</div><div style="margin-top:3px">${r.idx.map(x=>`<span class="ix" style="margin:0 0 0 4px">${x}</span>`).join("")}</div></div>
   <div style="text-align:left"><span class="badge b-${r.kind}">${KIND[r.kind]}</span><div class="num" style="margin-top:6px">$${f(r.close)} ${sg(r.chg)}</div></div></div>
   <div class="alert">🔔 רמת התראה (${r.kind==="B"?"SMA20":"תמיכה"}): <b class="num">$${f(r.alert)}</b> · מרחק <b class="num">${f(r.dist_atr)}</b> ATR
     <div class="nm" style="margin-top:4px">סוויפ = פתיל מתחת לרמה וחזרה מעליה ב‑15 דקות. ${r.overlap?"<b>חפיפה בין תמיכה אופקית ל‑SMA20.</b>":""}</div></div>
   ${chart(r)}
   <div class="st" style="margin-top:8px">
    <div><span>סוג התמיכה</span><b>${s?supType(s):"SMA20 בלבד"}</b></div>
    <div><span>תמיכה אופקית</span><b class="num">${s?`$${f(s.level)}`:"—"}</b></div>
    <div><span>מרחק מהתמיכה</span><b class="num">${s?`${f(s.atr)} ATR · ${f(s.pct)}%`:"—"}</b></div>
    <div><span>עומק (נרות)</span><b class="num">${s?`${s.depth} · נגיעה אחרונה לפני ${s.age}`:"—"}</b></div>
    <div><span>מרחק מ‑SMA20</span><b class="num">${f(r.sma20_atr)} ATR · ${f(r.sma20_pct)}%</b></div>
    <div><span>תגובות קודמות ל‑SMA20</span><b class="num">${r.sma_react}</b></div>
    <div><span>SMA20 · שיפוע 5 ימים</span><b class="num">$${f(r.sma20)} · ${sg(r.sma20_slope)}</b></div>
    <div><span>ATR(14)</span><b class="num">$${f(r.atr)} · ${f(r.atr_pct)}%</b></div>
    <div><span>גאפ דאון פתוח מעל</span><b class="num">${r.gap?`$${f(r.gap.bottom)}–${f(r.gap.top)} · ${sg(r.gap.dist)}`:"אין"}</b></div>
    <div><span>שווי שוק</span><b class="num">${mc(r.mcap)}</b></div>
    <div><span>ווליום ממוצע 50</span><b class="num">${f(r.vol50/1e6,1)}M · היום ${f(r.vol_ratio)}x</b></div>
    <div><span>RSI(14) · RSI35/EMA10</span><b class="num">${f(r.rsi14,1)} · ${f(r.rsi35_ema10,1)}</b></div>
    <div><span>EMA20 / EMA30</span><b class="num">${f(r.ema20)} / ${f(r.ema30)}</b></div>
    <div><span>EMA50 / EMA200</span><b class="num">${f(r.ema50)} / ${f(r.ema200)}</b></div>
    <div><span>SMA150</span><b class="num">${f(r.sma150)}</b></div>
   </div>
   <div class="tags">${sfTag(r)}<span class="tag ${r.above50?'ok':'no'}">${r.above50?'מעל':'מתחת'} SMA50</span>
    <span class="tag ${r.above200?'ok':'no'}">${r.above200?'מעל':'מתחת'} SMA200</span>
    <a class="tag" href="https://finviz.com/quote.ashx?t=${r.sym}&ty=si" target="_blank" rel="noopener">Finviz ↗</a>
    <a class="tag" href="https://www.tradingview.com/chart/?symbol=${r.sym}&interval=15" target="_blank" rel="noopener">TradingView 15m ↗</a></div></div>`;
}
function filtered(){return D.results.filter(r=>(!q||r.sym.includes(q.toUpperCase())||r.name.toUpperCase().includes(q.toUpperCase()))&&(!sec||r.sector===sec)&&(!ix||r.idx.includes(ix)));}
function filtersBar(){const secs=[...new Set(D.results.map(r=>r.sector))].sort();
  return `<div class="filters"><input id="q" placeholder="חיפוש סימול / שם" value="${q}"><select id="ix"><option value="">כל המדדים</option>${["S&P 500","Nasdaq-100"].map(s=>`<option ${s===ix?'selected':''}>${s}</option>`).join("")}</select><select id="sec"><option value="">כל הסקטורים</option>${secs.map(s=>`<option ${s===sec?'selected':''}>${s}</option>`).join("")}</select></div>`;}
function render(){
  const m=document.getElementById("main");
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));
  if(tab==="method"){m.innerHTML=method();return;}
  if(tab==="hist"){m.innerHTML=hist();return;}
  const rows=filtered();
  if(tab==="all"){
    m.innerHTML=filtersBar()+`<div style="overflow-x:auto"><table><tr><th>סימול</th><th>תרחיש</th><th>סגירה</th><th>שינוי</th><th>רמת התראה</th><th>מרחק ATR</th><th>סוג תמיכה</th><th>SMA20 (ATR)</th><th>תגובות SMA20</th><th>ATR %</th><th>גאפ פתוח</th><th>Short Float</th><th>שווי</th></tr>`+
    rows.map(r=>`<tr><td><b>${r.sym}</b></td><td><span class="badge b-${r.kind}">${KIND[r.kind]}</span></td><td class="num">${f(r.close)}</td><td>${sg(r.chg)}</td><td class="num">${f(r.alert)}</td><td class="num">${f(r.dist_atr)}</td><td>${r.sup?supType(r.sup):"SMA20"}</td><td class="num">${f(r.sma20_atr)}</td><td class="num">${r.sma_react}</td><td class="num">${f(r.atr_pct)}%</td><td>${r.gap?sg(r.gap.dist):"—"}</td><td>${sfTag(r)}</td><td class="num">${mc(r.mcap)}</td></tr>`).join("")+`</table></div>`;
  } else {
    const rs=rows.filter(r=>r.kind===tab);
    m.innerHTML=filtersBar()+(rs.length?`<div class="grid">${rs.map(card).join("")}</div>`:`<div class="empty">אין היום מניות בתרחיש הזה.</div>`);
  }
  const qi=document.getElementById("q");if(qi){qi.oninput=e=>{q=e.target.value;render();const n=document.getElementById("q");n.focus();n.setSelectionRange(q.length,q.length);};}
  const si=document.getElementById("sec");if(si){si.onchange=e=>{sec=e.target.value;render();};}
  const xi=document.getElementById("ix");if(xi){xi.onchange=e=>{ix=e.target.value;render();};}
}
function hist(){
  const cell=(a,cl)=>a?`<span class="num ${cl}">${a.length}</span> · ${a.join(", ")||"—"}`:"—";
  return `<table><tr><th>תאריך</th><th>חפיפה A+B</th><th>A · אופקית</th><th>B · SMA20</th></tr>`+
   D.history.map(h=>`<tr><td class="num">${h.date}</td><td>${cell(h.AB,"")}</td><td>${cell(h.A,"pos")}</td><td>${cell(h.B,"")}</td></tr>`).join("")+`</table>`;
}
function method(){
  const p=D.params,fn=D.funnel;
  return `<div class="prose"><h3>מטרה</h3>
  <p>בסיום יום המסחר מאתרים מניות שנמצאות ממש מעל תמיכה, כך שביום המסחר הבא עשוי להתרחש Liquidity Sweep שורי: פתיל מתחת לתמיכה שנקנה בחזרה. הסריקה רק מכינה את הרשימה ואת רמות ההתראה. הביצוע עצמו בגרף 15 דקות. לונג בלבד.</p>
  <h3>סינון בסיסי</h3>
  <ul><li>עולם: S&P 500 + נאסד"ק 100, בלי כפילויות.</li><li>מחיר מעל $${p.min_price}, ממוצע מחזור 50 יום של לפחות ${f(p.min_vol/1e6,0)}M מניות ביום, שווי שוק מעל $${f(p.min_mcap/1e9,0)}B.</li>
  <li>היום: ${fn.price} מעל המחיר המינימלי ← ${fn.volume} עם מחזור מספיק ← ${fn.setup} עם תרחיש A או B ← ${fn.mcap} אחרי סינון שווי השוק.</li></ul>
  <h3>תרחיש A — תמיכה אופקית</h3>
  <ul><li>רמות לפי פתילים (Low) בעומק של ${p.depths.join(", ")} נרות. שפל = הנמוך ביותר בטווח של ${p.swing} נרות לכל צד.</li>
  <li>תמיכה תקפה: לפחות ${p.min_touches} נגיעות נפרדות (במרחק של לפחות ${p.touch_gap} נרות זו מזו, עד ${p.touch_tol} ATR מעל הרמה), או שפל משמעותי בודד שממנו המחיר עלה לפחות ${p.react_atr} ATR בתוך ${p.react_bars} נרות.</li>
  <li>הרמה שלמה: מאז הנגיעה הראשונה אף פתיל לא ירד מתחתיה, כך שהנזילות מתחתיה עדיין לא נאספה.</li>
  <li>הסגירה של היום מעל התמיכה ובמרחק של עד ${p.near_atr} ATR(14), והפתיל של הנר האחרון לא חצה את הרמה.</li>
  <li>"עומק" בכרטיס הוא החלון הקטן ביותר מבין ${p.depths.join(" / ")} שבו הרמה מופיעה. תמיכה שמופיעה רק ב‑252 היא רמה ארוכת טווח.</li></ul>
  <h3>תרחיש B — תמיכה דינמית ב‑SMA20</h3>
  <ul><li>הסגירה מעל SMA20 ובמרחק של עד ${p.near_atr} ATR, והשפל של היום מעל SMA20.</li>
  <li>קרבה לממוצע לבדה לא מוכיחה שהוא משמש תמיכה. לכן נספרות <b>תגובות קודמות</b> ב‑${p.sma_look} הנרות האחרונים: נר שירד עד ${p.sma_tol} ATR מה‑SMA20, נסגר מעליו, ובתוך ${p.sma_bounce_bars} נרות עלה לפחות ${p.sma_bounce} ATR. ככל שיש יותר תגובות, הממוצע הוכיח את עצמו יותר.</li>
  <li>אם יש תמיכה אופקית במרחק של עד ${p.near_atr} ATR מה‑SMA20, מוצגת חפיפה. מניות שעומדות בשני התרחישים מופיעות בלשונית "חפיפה A+B".</li></ul>
  <h3>נתונים לעיון בלבד, לא מסננים</h3>
  <ul><li><b>גאפ דאון פתוח מעל המחיר:</b> הגאפ הקרוב ביותר שלא נסגר ב‑${p.gap_look} הנרות האחרונים, עם הגבולות והמרחק אליו. גאפ כזה הוא יעד אפשרי אחרי סוויפ.</li>
  <li><b>Short Float:</b> מ‑Yahoo. מעל ${p.short_mid}% מסומן בכתום, מעל ${p.short_hi}% באדום.</li>
  <li>ATR(14) בדולרים ובאחוזים, מרחק מ‑SMA20 ומהתמיכה באחוזים וב‑ATR, וסוג התמיכה.</li></ul>
  <h3>רמת ודאות ומקורות</h3>
  <p>מחירים, ממוצעים, ATR וגאפים <span class="conf c-f">עובדה</span>, מ‑Yahoo Finance, מתואמים לפיצולים בלבד כמו ב‑TradingView וב‑Finviz.</p>
