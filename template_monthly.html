<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>סורק חודשי EMA5/EMA8</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1117;--panel:#161b22;--panel2:#1c2330;--line:#2a3340;--txt:#e6edf3;--mut:#8b98a8;
--grn:#3fb950;--red:#f85149;--amb:#d29922;--blu:#58a6ff;--pur:#bc8cff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:Heebo,system-ui,sans-serif;font-size:15px}
.num{font-family:"JetBrains Mono",monospace;direction:ltr;unicode-bidi:isolate}
header{padding:22px 16px 10px;max-width:1200px;margin:auto}
h1{margin:0;font-size:24px}
.sub{color:var(--mut);margin-top:6px;font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
.kpi b{display:block;font-size:24px;margin-top:4px}
.kpi span{color:var(--mut);font-size:12px}
nav{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
nav .in{max-width:1200px;margin:auto;display:flex;gap:4px;overflow-x:auto;padding:0 16px}
nav button{background:none;border:0;color:var(--mut);padding:12px 14px;font:inherit;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent}
nav button.on{color:var(--txt);border-color:var(--blu)}
nav .ct{background:var(--panel2);border-radius:9px;padding:1px 7px;font-size:12px;margin-inline-start:5px}
main{max-width:1200px;margin:auto;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.sym{font-size:20px;font-weight:700}
.nm{color:var(--mut);font-size:12px}
.badge{font-size:12px;padding:3px 9px;border-radius:20px;white-space:nowrap}
.b-breakout{background:#3fb95026;color:var(--grn)}.b-above{background:#58a6ff26;color:var(--blu)}
.b-near{background:#d2992226;color:var(--amb)}.b-forming{background:#8b98a826;color:var(--mut)}
svg{width:100%;height:150px;display:block;margin:10px 0 6px}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 10px;font-size:12px}
.st div>span{color:var(--mut);display:block}
.st div b{font-weight:600}
.tags{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;border:1px solid var(--line);border-radius:6px;padding:2px 6px;color:var(--mut)}
.tag.ok{color:var(--grn);border-color:#3fb95055}.tag.no{color:var(--red);border-color:#f8514955}
.empty{color:var(--mut);padding:40px;text-align:center;background:var(--panel);border-radius:12px}
.pos{color:var(--grn)}.neg{color:var(--red)}
table{width:100%;border-collapse:collapse;background:var(--panel);border-radius:12px;overflow:hidden;font-size:13px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right}
th{color:var(--mut);font-weight:500}
.prose{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;line-height:1.7}
.prose h3{margin-top:0}
.conf{font-size:11px;padding:1px 6px;border-radius:5px;margin-inline-start:6px}
.c-f{background:#3fb95022;color:var(--grn)}.c-e{background:#d2992222;color:var(--amb)}
.filters{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.filters input,.filters select{background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:7px 10px;font:inherit}
a{color:var(--blu)}
@media(max-width:420px){.grid{grid-template-columns:1fr}}
</style>
<style>
.b-golden{background:#3fb95026;color:var(--grn)}.b-death{background:#f8514926;color:var(--red)}
.b-golden_conf{background:#3fb950;color:#0d1117}.b-death_conf{background:#f85149;color:#0d1117}
.warn{background:#d2992222;color:var(--amb);padding:8px 12px;border-radius:8px;margin-top:8px;font-size:13px}
.legend{display:flex;gap:12px;font-size:11px;color:var(--mut);flex-wrap:wrap}.legend i{display:inline-block;width:14px;height:2px;vertical-align:middle;margin-inline-end:4px}
.xnav{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin-top:8px}
</style>
</head>
<body>
<header>
  <h1>📅 גרף חודשי: גולדן קרוס / דת' קרוס EMA5 · EMA8 — S&amp;P 500</h1>
  <div class="sub" id="sub"></div>
  <div class="xnav"><a href="../trend/">📈 חציית EMA30/50</a><a href="../cross20/">✂️ EMA20/SMA20 + RSI10</a><a href="../channel/">📐 תעלות מחיר</a><a href="../trendline/">📏 שבירת קווי מגמה</a><a href="../presweep/">🧲 Pre-Sweep לונג</a><a href="../monthly/">📅 חודשי EMA5/8</a></div>
  <div id="warn"></div>
  <div class="kpis" id="kpis"></div>
</header>
<nav><div class="in" id="tabs"></div></nav>
<main id="main"></main>
<script>
const D = /*__DATA__*/null;
const KIND={golden:"גולדן קרוס החודש ▲",death:"דת' קרוס החודש ▼",golden_conf:"גולדן קרוס · נסגר",death_conf:"דת' קרוס · נסגר"};
const TABS=[["golden","▲ גולדן קרוס החודש"],["death","▼ דת' קרוס החודש"],["golden_conf","✅ גולדן · חודש קודם"],["death_conf","❌ דת' · חודש קודם"],["all","טבלה מלאה"],["hist","היסטוריה"],["method","מתודולוגיה"]];
let tab="golden",q="",sec="";
const f=(x,d=2)=>x==null?"—":Number(x).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
const sg=x=>x==null?"—":`<span class="num ${x>=0?'pos':'neg'}">${x>=0?'+':''}${f(x)}%</span>`;
function chart(r){
  const k=r.chart,n=k.c.length,W=340,H=170,pad=6,bw=(W-2*pad)/n*0.6;
  const all=[...k.h,...k.l,...k.e5,...k.e8],lo=Math.min(...all),hi=Math.max(...all),rg=(hi-lo)||1;
  const X=i=>pad+(W-2*pad)*(i+0.5)/n,Y=v=>H-pad-(H-2*pad)*(v-lo)/rg;
  const path=a=>a.map((v,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join("");
  const candles=k.c.map((c,i)=>{const up=c>=k.o[i],col=up?"#3fb950":"#f85149",y1=Y(Math.max(c,k.o[i])),y2=Y(Math.min(c,k.o[i]));
    return `<line x1="${X(i)}" x2="${X(i)}" y1="${Y(k.h[i])}" y2="${Y(k.l[i])}" stroke="${col}" stroke-width="1"/><rect x="${X(i)-bw/2}" y="${y1}" width="${bw}" height="${Math.max(1,y2-y1)}" fill="${col}" ${i===n-1?'fill-opacity="0.45" stroke="'+col+'" stroke-dasharray="2 1"':''}/>`;}).join("");
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:${H}px">${candles}<path d="${path(k.e8)}" fill="none" stroke="#d29922" stroke-width="1.8"/><path d="${path(k.e5)}" fill="none" stroke="#58a6ff" stroke-width="1.8"/></svg>
   <div class="legend"><span><i style="background:#58a6ff"></i>EMA5</span><span><i style="background:#d29922"></i>EMA8</span><span>נרות חודשיים · ${k.d[0]}–${k.d[n-1]} · הנר האחרון עדיין פתוח</span></div>`;
}
function card(r){
  const cur=r.kind==="golden"||r.kind==="death";
  return `<div class="card"><div class="top"><div><div class="sym">${r.sym}</div><div class="nm">${r.name} · ${r.sector}</div></div>
   <div style="text-align:left"><span class="badge b-${r.kind}">${KIND[r.kind]}</span><div class="num" style="margin-top:6px">$${f(r.close)} ${sg(r.chg)}</div></div></div>
   <div class="tags" style="margin:8px 0 0"><span class="tag">המצב הקודם נמשך <span class="num">${r.prior}</span> חודשים</span><span class="tag">החודש עד כה ${sg(r.mchg)}</span>
   ${cur?`<span class="tag">החצייה מתבטלת ב‑$${f(r.flip)} (${sg(r.flip_pct)})</span>`:""}</div>
   ${chart(r)}
   <div class="st" style="margin-top:8px">
    <div><span>EMA5 / EMA8 חודשי</span><b class="num">${f(r.ema5)} / ${f(r.ema8)}</b></div>
    <div><span>פער EMA5–EMA8</span><b>${sg(r.gap)}</b></div>
    <div><span>RSI(14) חודשי</span><b class="num">${f(r.mrsi14,1)}</b></div>
    <div><span>RSI(14) יומי</span><b class="num">${f(r.rsi14,1)}</b></div>
    <div><span>RSI(35)/EMA(10) יומי</span><b class="num">${f(r.rsi35_ema10,1)}</b></div>
    <div><span>EMA20 / EMA30 יומי</span><b class="num">${f(r.ema20)} / ${f(r.ema30)}</b></div>
    <div><span>EMA50 / EMA200 יומי</span><b class="num">${f(r.ema50)} / ${f(r.ema200)}</b></div>
    <div><span>SMA20 / SMA150 יומי</span><b class="num">${f(r.sma20)} / ${f(r.sma150)}</b></div>
   </div>
   <div class="tags"><span class="tag ${r.above50?'ok':'no'}">${r.above50?'מעל':'מתחת'} SMA50</span>
    <span class="tag ${r.above200?'ok':'no'}">${r.above200?'מעל':'מתחת'} SMA200</span>
    <a class="tag" href="https://finviz.com/quote.ashx?t=${r.sym}&p=m" target="_blank" rel="noopener">Finviz ↗</a>
    <a class="tag" href="https://www.tradingview.com/chart/?symbol=${r.sym}&interval=1M" target="_blank" rel="noopener">TradingView חודשי ↗</a></div></div>`;
}
function filtered(){return D.results.filter(r=>(!q||r.sym.includes(q.toUpperCase())||r.name.toUpperCase().includes(q.toUpperCase()))&&(!sec||r.sector===sec));}
function filtersBar(){const secs=[...new Set(D.results.map(r=>r.sector))].sort();
  return `<div class="filters"><input id="q" placeholder="חיפוש סימול / שם" value="${q}"><select id="sec"><option value="">כל הסקטורים</option>${secs.map(s=>`<option ${s===sec?'selected':''}>${s}</option>`).join("")}</select></div>`;}
function render(){
  const m=document.getElementById("main");
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));
  if(tab==="method"){m.innerHTML=method();return;}
  if(tab==="hist"){m.innerHTML=hist();return;}
  const rows=filtered();
  if(tab==="all"){
    m.innerHTML=filtersBar()+`<div style="overflow-x:auto"><table><tr><th>סימול</th><th>מצב</th><th>סגירה</th><th>החודש</th><th>EMA5</th><th>EMA8</th><th>פער</th><th>מתבטל ב‑</th><th>מצב קודם (חודשים)</th><th>RSI14 חודשי</th><th>סקטור</th></tr>`+
    rows.map(r=>`<tr><td><b>${r.sym}</b></td><td><span class="badge b-${r.kind}">${KIND[r.kind]}</span></td><td class="num">${f(r.close)}</td><td>${sg(r.mchg)}</td><td class="num">${f(r.ema5)}</td><td class="num">${f(r.ema8)}</td><td>${sg(r.gap)}</td><td>${r.flip!=null?`${f(r.flip)} (${sg(r.flip_pct)})`:"—"}</td><td class="num">${r.prior}</td><td class="num">${f(r.mrsi14,0)}</td><td>${r.sector}</td></tr>`).join("")+`</table></div>`;
  } else {
    const rs=rows.filter(r=>r.kind===tab);
    m.innerHTML=filtersBar()+(rs.length?`<div class="grid">${rs.map(card).join("")}</div>`:`<div class="empty">אין מניות במצב הזה.</div>`);
  }
  const qi=document.getElementById("q");if(qi){qi.oninput=e=>{q=e.target.value;render();const n=document.getElementById("q");n.focus();n.setSelectionRange(q.length,q.length);};}
  const si=document.getElementById("sec");if(si){si.onchange=e=>{sec=e.target.value;render();};}
}
function hist(){
  const cell=(a,cl)=>a?`<span class="num ${cl}">${a.length}</span> · ${a.join(", ")||"—"}`:"—";
  return `<p class="sub">רשימת הגולדן/דת' קרוס של החודש הפתוח, כפי שנראתה בכל יום. מניה שנעלמת מהרשימה באמצע החודש = החצייה התבטלה.</p><table><tr><th>תאריך</th><th>גולדן קרוס החודש</th><th>דת' קרוס החודש</th></tr>`+
   D.history.map(h=>`<tr><td class="num">${h.date}</td><td>${cell(h.golden,"pos")}</td><td>${cell(h.death,"neg")}</td></tr>`).join("")+`</table>`;
}
function method(){
  return `<div class="prose"><h3>מה הסורק בודק</h3>
  <p>בכל יום מסחר בשעה 23:10 שעון ישראל נסרקות כל מניות ה‑S&P 500 על <b>נרות חודשיים</b>.</p>
  <ul><li><b>גולדן קרוס:</b> EMA5 חוצה מעל EMA8. <b>דת' קרוס:</b> EMA5 חוצה מתחת ל‑EMA8. הממוצעים מחושבים על סגירות חודשיות.</li>
  <li><b>החודש (זמני):</b> הנר של החודש הנוכחי עדיין פתוח, והסגירה שלו היא מחיר הסגירה של היום. החצייה מושווית לחודש הקודם שנסגר. עד סוף החודש החצייה יכולה עוד להתבטל. בכרטיס מופיע המחיר שבו היא תתבטל, כלומר המחיר שבו EMA5 ו‑EMA8 של החודש יהיו שווים.</li>
  <li><b>חודש קודם (סופי):</b> החצייה קרתה בנר החודשי האחרון שכבר נסגר, ולכן היא סופית.</li>
  <li><b>מצב קודם:</b> כמה חודשים EMA5 היה בצד השני לפני החצייה. מצב קודם ארוך = מפנה משמעותי יותר.</li>
  <li><b>מיון:</b> לפי גודל הפער בין EMA5 ל‑EMA8, מהגדול לקטן.</li></ul>
  <h3>רמת ודאות ומקורות</h3>
  <p>נרות חודשיים ויומיים <span class="conf c-f">עובדה</span>, מ‑Yahoo Finance, מתואמים לפיצולים בלבד ולא לדיבידנדים, כמו ב‑TradingView וב‑Finviz. EMA מחושב על 15 שנות היסטוריה חודשית, כך שהערך יציב ותואם לפלטפורמות הגרפים.</p>
  <p>חצייה בחודש הפתוח היא זמנית <span class="conf c-e">הערכה</span> עד סגירת החודש.</p>
  <p class="sub">מקור הרשימה: ${D.source} · נסרקו ${D.scanned} מתוך ${D.universe}${D.stale?` · ${D.stale} ללא נתונים עדכניים`:""} · נוצר ${D.generated}</p></div>`;
}
(function init(){
  const c=k=>D.results.filter(r=>r.kind===k).length;
  document.getElementById("sub").innerHTML=(D.intraday?`<div style="background:#d2992226;color:#d29922;padding:8px 12px;border-radius:8px;margin-bottom:6px">⚠️ הרצת בדיקה במהלך יום המסחר. הנתונים חלקיים ויוחלפו בסריקה של 23:10.</div>`:"")+`נתוני סגירה ל‑<span class="num">${D.asof}</span> · נסרקו <span class="num">${D.scanned}</span> מניות · עודכן ${D.generated}`;
  document.getElementById("warn").innerHTML=D.last_day?`<div class="warn" style="background:#3fb95022;color:var(--grn)">✅ היום הוא יום המסחר האחרון של החודש: החציות של החודש נסגרו עם הנר.</div>`:`<div class="warn">⏳ החודש פתוח (יום מסחר ${D.month_days} בחודש). חציות "החודש" זמניות עד הסגירה החודשית.</div>`;
  document.getElementById("kpis").innerHTML=[["גולדן קרוס החודש",c("golden")],["דת' קרוס החודש",c("death")],["גולדן · חודש קודם",c("golden_conf")],["דת' · חודש קודם",c("death_conf")]].map(([a,b])=>`<div class="kpi"><span>${a}</span><b class="num">${b}</b></div>`).join("");
  const cnt={golden:c("golden"),death:c("death"),golden_conf:c("golden_conf"),death_conf:c("death_conf"),all:D.results.length};
  document.getElementById("tabs").innerHTML=TABS.map(([k,v])=>`<button data-t="${k}">${v}${cnt[k]!=null?`<span class="ct num">${cnt[k]}</span>`:""}</button>`).join("");
  document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;render();});
  if(!cnt.golden)tab=["death","golden_conf","death_conf"].find(k=>cnt[k])||"golden";
  render();
})();
</script>
</body>
</html>
